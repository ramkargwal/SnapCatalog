name: Build & Release Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build APK and Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK licenses
        run: |
          if [ -n "$ANDROID_HOME" ] && [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build Android APK
        id: build_apk
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          mkdir -p release-artifacts
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "Release signing secrets detected. Building signed Release APK..."
            printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > "$GITHUB_WORKSPACE/my-upload-key.jks"
            export KEYSTORE_PATH="$GITHUB_WORKSPACE/my-upload-key.jks"
            ./gradlew assembleRelease --no-daemon
            cp app/build/outputs/apk/release/*.apk "release-artifacts/SnapCatalog-v1.0.${{ github.run_number }}-release.apk"
            echo "build_type=Release (Signed)" >> "$GITHUB_OUTPUT"
          else
            echo "No release signing secrets configured. Building Debug APK..."
            if [ -f debug.keystore.base64 ]; then
              tr -d '[:space:]' < debug.keystore.base64 | base64 -d > debug.keystore
            elif [ ! -f debug.keystore ]; then
              keytool -genkeypair -v \
                -keystore debug.keystore \
                -storepass android \
                -alias androiddebugkey \
                -keypass android \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
            ./gradlew assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/*.apk "release-artifacts/SnapCatalog-v1.0.${{ github.run_number }}-debug.apk"
            echo "build_type=Debug" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: SnapCatalog v1.0.${{ github.run_number }}
          body: |
            Automated Android APK build for **SnapCatalog**.

            - **Build Type:** ${{ steps.build_apk.outputs.build_type }}
            - **Commit:** `${{ github.sha }}`
            - **Run Number:** `#${{ github.run_number }}`

            Download the `.apk` file attached below to install on Android 7.0 (API 24) or higher.
          files: release-artifacts/*.apk
          generate_release_notes: true
